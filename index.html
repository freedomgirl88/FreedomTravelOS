<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07162c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Freedom" />
    <link rel="apple-touch-icon" href="/FreedomTravelOS/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/FreedomTravelOS/icons/icon-192.png" />
    <link rel="manifest" href="/FreedomTravelOS/manifest.webmanifest?v=252" />
    <title>Freedom Travel OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      (function() {
        if (!('serviceWorker' in navigator)) {
          console.log('Service workers not supported');
          return;
        }

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/FreedomTravelOS/sw.js?v=252', {
            scope: '/FreedomTravelOS/'
          }).then(registration => {
            console.log('✓ Service Worker registered', registration);
            const announceWaiting = () => {
              if (registration.waiting && navigator.serviceWorker.controller) {
                window.dispatchEvent(new CustomEvent('ftos-update-ready', { detail: { registration } }));
              }
            };
            announceWaiting();
            registration.addEventListener('updatefound', () => {
              const worker = registration.installing;
              worker?.addEventListener('statechange', () => {
                if (worker.state === 'installed') announceWaiting();
              });
            });
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (reloading) return;
              reloading = true;
              window.location.reload();
            });
          }).catch(error => {
            console.error('✗ Service Worker registration failed:', error);
          });
        });
      })();
    </script>
  </body>
</html>
